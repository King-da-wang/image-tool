<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>即拍即剪</title>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  :root{
    --bg:#ffffff; --fg:#171717; --line:#e5e5e5; --hover:#f5f5f5;
    --sub:#737373; --dot:#e7e7e7;
    --primary-bg:#171717; --primary-fg:#ffffff; --primary-hover:#404040;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#000000; --fg:#fafafa; --line:#262626; --hover:#171717;
      --sub:#a3a3a3; --dot:#1c1c1c;
      --primary-bg:#fafafa; --primary-fg:#0a0a0a; --primary-hover:#d4d4d4;
    }
  }
  html,body{ height:100%; }
  body{
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    background:var(--bg); color:var(--fg);
    -webkit-font-smoothing:antialiased;
    overflow-y:auto;
  }
  button{ font-family:inherit; color:inherit; }
  .app{
    height:100vh; height:100dvh; max-width:56rem; margin:0 auto;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column;
  }
  .stage{
    flex:1; min-height:200px; position:relative;
    border:1px solid var(--line); border-radius:14px; overflow:hidden;
    background-image:radial-gradient(var(--dot) 1px, transparent 1px);
    background-size:16px 16px;
  }
  .stage-inner{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:14px;
  }
  #viewCanvas{
    display:none; max-width:100%; max-height:100%;
    box-shadow:0 0 0 1px var(--line);
    touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  }
  #viewCanvas.show{ display:block; }
  .confirm-bar{
    position:absolute; left:50%; bottom:14px; transform:translateX(-50%);
    display:none; align-items:center; gap:8px; white-space:nowrap;
    background:var(--bg); border:1px solid var(--line); border-radius:10px;
    padding:6px 6px 6px 14px; box-shadow:0 4px 16px rgba(0,0,0,.08);
  }
  .confirm-bar.show{ display:flex; }
  #pendingLabel{ font-size:12px; color:var(--sub); }
  .mini-primary{
    height:32px; padding:0 14px; border:none; border-radius:8px; cursor:pointer;
    background:var(--primary-bg); color:var(--primary-fg); font-size:12px; font-weight:600;
  }
  .mini-ghost{
    height:32px; padding:0 12px; border:1px solid var(--line); border-radius:8px;
    background:transparent; font-size:12px; cursor:pointer;
  }
  .mini-ghost:hover{ background:var(--hover); }
  .controls{ flex:none; margin-top:16px; }
  .grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
    max-width:28rem; margin:0 auto 14px;
  }
  .cell{
    height:64px; border:1px solid var(--line); border-radius:12px; background:transparent;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    font-size:12px; font-weight:500; cursor:pointer;
    transition:background-color .15s ease, color .15s ease, border-color .15s ease;
  }
  .cell:hover{ background:var(--hover); }
  .cell:active{ opacity:.8; }
  .cell svg{ width:20px; height:20px; }
  .cell.active{ background:var(--primary-bg); color:var(--primary-fg); border-color:var(--primary-bg); }
  .primary{
    width:100%; height:48px; border:none; border-radius:12px; cursor:pointer;
    background:var(--primary-bg); color:var(--primary-fg);
    font-size:15px; font-weight:500;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:opacity .15s ease;
  }
  .primary:active{ opacity:.8; }
  .primary svg{ width:20px; height:20px; }
  .locked{ opacity:.3; pointer-events:none; transition:opacity .2s; }
  #toast{
    position:fixed; left:50%; top:50%;
    transform:translate(-50%,-50%) scale(.95); opacity:0; pointer-events:none;
    transition:all .25s ease; z-index:50;
    padding:10px 16px; border-radius:10px; font-size:14px; font-weight:500;
    background:var(--bg); border:1px solid var(--line);
    box-shadow:0 4px 16px rgba(0,0,0,.08);
  }
  #toast.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  #toast.error{ color:#dc2626; border-color:#fecaca; }
  @media (prefers-color-scheme: dark){ #toast.error{ color:#f87171; border-color:#7f1d1d; } }
</style>
</head>
<body>
<input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
<input type="file" id="albumInput" accept="image/*" style="display:none">
<main class="app">
  <section class="stage">
    <div class="stage-inner">
      <canvas id="viewCanvas"></canvas>
    </div>
    <div id="confirmBar" class="confirm-bar">
      <span id="pendingLabel"></span>
      <button id="applyBtn" class="mini-primary">应用</button>
      <button id="cancelBtn" class="mini-ghost">取消</button>
    </div>
  </section>
  <div class="controls">
    <div id="toolRow" class="grid">
      <button data-tool="crop" class="cell">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>
        裁切
      </button>
      <button data-tool="lasso" class="cell">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4c5 0 9 2.5 9 5.5S16.97 15 12 15s-9-2.5-9-5.5S7 4 12 4Z" stroke-dasharray="4 3"/><path d="M8.5 14.5C7 16 6 17.5 6 19a2.5 2.5 0 0 0 5 .5"/></svg>
        圈选
      </button>
      <button id="rotateBtn" class="cell">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        左转90°
      </button>
      <button id="resetBtn" class="cell">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        复原
      </button>
      <button id="gridCameraBtn" class="cell">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7.5 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3.5L14.5 4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        拍照
      </button>
      <button id="gridAlbumBtn" class="cell">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4-4L5 22"/></svg>
        上传
      </button>
    </div>
    <button id="copyBtn" class="primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 12 2 2 4-4"/></svg>
      复制/保存到相册
    </button>
  </div>
</main>
<div id="toast"></div>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const viewCanvas = $('viewCanvas'), vctx = viewCanvas.getContext('2d');
  const imgCanvas = document.createElement('canvas');   
  let originalCanvas = null;                            
  let hasImage = false, edited = false;
  let mode = 'idle';       
  let pending = null;      
  let drawing = false, startPt = null, antsOffset = 0;

  function toast(msg, type){
    const t = $('toast');
    t.textContent = msg;
    t.classList.toggle('error', type === 'error');
    if(hasImage){
      const r = viewCanvas.getBoundingClientRect();   
      t.style.left = (r.left + r.width / 2) + 'px';
      t.style.top  = (r.top  + r.height / 2) + 'px';
    } else {
      t.style.left = '50%'; t.style.top  = '50%';
    }
    t.classList.add('show');
    clearTimeout(t._tm);
    t._tm = setTimeout(()=> t.classList.remove('show'), 2200);
  }

  $('gridCameraBtn').onclick = () => $('cameraInput').click();
  $('gridAlbumBtn').onclick  = () => $('albumInput').click();
  $('cameraInput').addEventListener('change', e => { const f = e.target.files[0]; if(f) loadFile(f); e.target.value=''; });
  $('albumInput').addEventListener('change',  e => { const f = e.target.files[0]; if(f) loadFile(f); e.target.value=''; });

  function cloneCanvas(src){
    const c = document.createElement('canvas');
    c.width = src.width; c.height = src.height;
    c.getContext('2d').drawImage(src, 0, 0);
    return c;
  }

  function loadFile(file){
    if(!file.type.startsWith('image/')){ toast('请选择图片文件','error'); return; }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const MAX = 4096;
      let w = img.naturalWidth, h = img.naturalHeight;
      const sc = Math.min(1, MAX / Math.max(w,h));
      w = Math.max(1, Math.round(w*sc)); h = Math.max(1, Math.round(h*sc));
      imgCanvas.width = w; imgCanvas.height = h;
      imgCanvas.getContext('2d').drawImage(img, 0, 0, w, h);
      originalCanvas = cloneCanvas(imgCanvas);   
      URL.revokeObjectURL(url);
      hasImage = true; edited = false; pending = null; drawing = false;
      viewCanvas.classList.add('show');
      setMode('idle'); fitView(); render(); updateLock();
      toast('图片已载入');
    };
    img.onerror = () => { URL.revokeObjectURL(url); toast('图片加载失败，请换一张','error'); };
    img.src = url;
  }

  function fitView(){
    const MAXV = 1600;
    const s = Math.min(1, MAXV / Math.max(imgCanvas.width, imgCanvas.height));
    viewCanvas.width  = Math.max(1, Math.round(imgCanvas.width  * s));
    viewCanvas.height = Math.max(1, Math.round(imgCanvas.height * s));
  }
  function setMode(m){
    mode = m;
    document.querySelectorAll('.cell[data-tool]').forEach(b =>
      b.classList.toggle('active', b.dataset.tool === m));
    viewCanvas.style.cursor = m === 'idle' ? 'default' : 'crosshair';
  }
  function updateLock(){
    const on = !!pending && !drawing;
    $('toolRow').classList.toggle('locked', on);
    $('copyBtn').classList.toggle('locked', on);
    $('confirmBar').classList.toggle('show', on);
    if(on){
      $('pendingLabel').textContent = pending.type === 'crop'
        ? '已框选 ' + pending.w + ' × ' + pending.h + ' px'
        : '已圈选 ' + pending.points.length + ' 个点位';
    }
  }

  function render(){
    if(!hasImage) return;
    const W = viewCanvas.width, H = viewCanvas.height;
    vctx.clearRect(0,0,W,H);
    vctx.drawImage(imgCanvas, 0, 0, W, H);
    if(pending && pending.type === 'crop')  drawCropOverlay();
    if(pending && pending.type === 'lasso') drawLassoOverlay();
  }
  function drawCropOverlay(){
    const s = viewCanvas.width / imgCanvas.width;
    const W = viewCanvas.width, H = viewCanvas.height;
    const vx = pending.x*s, vy = pending.y*s, vw = pending.w*s, vh = pending.h*s;
    vctx.save();
    vctx.fillStyle = 'rgba(0,0,0,.55)'; vctx.fillRect(0,0,W,H);
    vctx.beginPath(); vctx.rect(vx,vy,vw,vh); vctx.clip();
    vctx.drawImage(imgCanvas,0,0,W,H);
    vctx.restore();
    vctx.save();
    vctx.strokeStyle = 'rgba(255,255,255,.3)';
    vctx.lineWidth = Math.max(1, s);
    vctx.beginPath();
    for(let i=1;i<3;i++){
      vctx.moveTo(vx+vw*i/3, vy); vctx.lineTo(vx+vw*i/3, vy+vh);
      vctx.moveTo(vx, vy+vh*i/3); vctx.lineTo(vx+vw, vy+vh*i/3);
    }
    vctx.stroke();
    vctx.strokeStyle = '#3b82f6';
    vctx.lineWidth = Math.max(2, W/500);
    vctx.setLineDash([10,6]); vctx.lineDashOffset = antsOffset;
    vctx.strokeRect(vx,vy,vw,vh);
    vctx.setLineDash([]);
    const hs = Math.max(8, W/130);
    vctx.fillStyle = '#3b82f6';
    [[vx,vy],[vx+vw,vy],[vx,vy+vh],[vx+vw,vy+vh]].forEach(c => {
      vctx.fillRect(c[0]-hs/2, c[1]-hs/2, hs, hs);
    });
    vctx.restore();
  }
  function drawLassoOverlay(){
    const s = viewCanvas.width / imgCanvas.width;
    const W = viewCanvas.width, H = viewCanvas.height;
    const pts = pending.points;
    const tracePath = () => {
      vctx.beginPath();
      pts.forEach((p,i)=>{ const px=p.x*s, py=p.y*s; i ? vctx.lineTo(px,py) : vctx.moveTo(px,py); });
      vctx.closePath();
    };
    vctx.save();
    vctx.fillStyle = 'rgba(0,0,0,.55)'; vctx.fillRect(0,0,W,H);
    tracePath(); vctx.clip();
    vctx.drawImage(imgCanvas,0,0,W,H);
    vctx.restore();
    vctx.save();
    tracePath();
    vctx.strokeStyle = '#3b82f6';
    vctx.lineWidth = Math.max(2, W/500);
    vctx.setLineDash([10,6]); vctx.lineDashOffset = antsOffset;
    vctx.stroke();
    vctx.restore();
  }
  (function tick(){
    if(pending){ antsOffset -= .6; render(); }
    requestAnimationFrame(tick);
  })();

  function toImg(e){
    const r = viewCanvas.getBoundingClientRect();
    return {
      x: Math.min(imgCanvas.width,  Math.max(0, (e.clientX - r.left) * imgCanvas.width  / r.width)),
      y: Math.min(imgCanvas.height, Math.max(0, (e.clientY - r.top)  * imgCanvas.height / r.height))
    };
  }
  viewCanvas.addEventListener('pointerdown', e => {
    if(!hasImage || mode === 'idle' || drawing || pending) return;
    e.preventDefault();
    viewCanvas.setPointerCapture(e.pointerId);
    drawing = true; startPt = toImg(e);
    pending = mode === 'crop'
      ? { type:'crop', x:startPt.x, y:startPt.y, w:0, h:0 }
      : { type:'lasso', points:[startPt] };
  });
  viewCanvas.addEventListener('pointermove', e => {
    if(!drawing || !pending) return;
    e.preventDefault();
    const p = toImg(e);
    if(pending.type === 'crop'){
      pending = { type:'crop',
        x: Math.min(startPt.x, p.x), y: Math.min(startPt.y, p.y),
        w: Math.abs(p.x - startPt.x), h: Math.abs(p.y - startPt.y) };
    } else {
      const last = pending.points[pending.points.length-1];
      const th = Math.max(2, imgCanvas.width / 500);
      if(Math.hypot(p.x-last.x, p.y-last.y) > th) pending.points.push(p);
    }
    render();
  });
  function endDraw(){
    if(!drawing) return;
    drawing = false;
    if(pending && pending.type === 'crop' && (pending.w < 8 || pending.h < 8)){
      pending = null; toast('选区太小，请重新框选','error');
    }
    if(pending && pending.type === 'lasso' && pending.points.length < 6){
      pending = null; toast('圈选范围太小，请重新圈选','error');
    }
    if(pending && pending.type === 'crop'){
      pending = { type:'crop',
        x: Math.round(pending.x), y: Math.round(pending.y),
        w: Math.round(pending.w), h: Math.round(pending.h) };
    }
    render(); updateLock();
  }
  viewCanvas.addEventListener('pointerup', endDraw);
  viewCanvas.addEventListener('pointercancel', endDraw);
  viewCanvas.addEventListener('contextmenu', e => e.preventDefault());

  $('copyBtn').addEventListener('click', async () => {
    if(!hasImage) return;
    try{
      if(!navigator.clipboard || typeof ClipboardItem === 'undefined') throw new Error('unsupported');
      await navigator.clipboard.write([ new ClipboardItem({
        'image/png': new Promise(resolve => imgCanvas.toBlob(resolve, 'image/png'))
      }) ]);
      toast('已复制到粘贴板');
    }catch(err){
      try{
        const blob = await new Promise(res => imgCanvas.toBlob(res, 'image/png'));
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = '编辑后的图片.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=> URL.revokeObjectURL(a.href), 3000);
        toast('已触发下载，可保存到相册');
      }catch(e2){ toast('当前浏览器无法复制图片','error'); }
    }
  });

  document.querySelectorAll('.cell[data-tool]').forEach(btn => {
    btn.addEventListener('click', () => {
      if(pending || !hasImage) return;
      const t = btn.dataset.tool;
      setMode(mode === t ? 'idle' : t);
    });
  });

  $('rotateBtn').addEventListener('click', () => {
    if(!hasImage || pending) return;
    const w = imgCanvas.width, h = imgCanvas.height;
    const c = document.createElement('canvas');
    c.width = h; c.height = w;
    const ctx = c.getContext('2d');
    ctx.translate(0, w);
    ctx.rotate(-Math.PI / 2);
    ctx.drawImage(imgCanvas, 0, 0);
    imgCanvas.width = c.width; imgCanvas.height = c.height;
    imgCanvas.getContext('2d').drawImage(c, 0, 0);
    edited = true;
    fitView(); render();
    toast('已逆时针旋转 90°');
  });

  $('resetBtn').addEventListener('click', () => {
    if(!hasImage || pending) return;
    if(!edited || !originalCanvas){ toast('当前已是原图'); return; }
    imgCanvas.width = originalCanvas.width;
    imgCanvas.height = originalCanvas.height;
    imgCanvas.getContext('2d').drawImage(originalCanvas, 0, 0);
    edited = false;
    setMode('idle'); fitView(); render();
    toast('已复原，所有编辑效果已清除');
  });

  $('applyBtn').addEventListener('click', applyPending);
  $('cancelBtn').addEventListener('click', () => {
    pending = null; updateLock(); render(); toast('已取消选区，可重新操作');
  });

  function applyPending(){
    if(!pending) return;
    if(pending.type === 'crop'){
      const x = pending.x, y = pending.y;
      const w = Math.max(1, Math.min(pending.w, imgCanvas.width - x));
      const h = Math.max(1, Math.min(pending.h, imgCanvas.height - y));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(imgCanvas, x, y, w, h, 0, 0, w, h);
      imgCanvas.width = w; imgCanvas.height = h;
      imgCanvas.getContext('2d').drawImage(c, 0, 0);
    } else {
      const c = document.createElement('canvas');
      c.width = imgCanvas.width; c.height = imgCanvas.height;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff';                 
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.save();
      ctx.beginPath();
      pending.points.forEach((p,i)=> i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y));
      ctx.closePath(); ctx.clip();
      ctx.drawImage(imgCanvas, 0, 0);            
      ctx.restore();
      imgCanvas.width = c.width; imgCanvas.height = c.height;
      imgCanvas.getContext('2d').drawImage(c, 0, 0);
    }
    pending = null; edited = true;
    setMode('idle'); fitView(); render(); updateLock();
    toast('已应用');
  }

  window.addEventListener('keydown', e => {
    if(!pending) return;
    if(e.key === 'Enter'){ e.preventDefault(); applyPending(); }
    if(e.key === 'Escape'){ pending = null; updateLock(); render(); toast('已取消选区'); }
  });

  setMode('idle');
})();
</script>

<!-- 【新增】离线缓存 Service Worker 注册逻辑 -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
