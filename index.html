<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>即拍即剪</title>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  :root{
    --bg:#ffffff; --fg:#171717; --line:#e5e5e5; --hover:#f5f5f5;
    --sub:#737373; --dot:#e7e7e7;
    --primary-bg:#171717; --primary-fg:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#000000; --fg:#fafafa; --line:#262626; --hover:#171717;
      --sub:#a3a3a3; --dot:#1c1c1c;
      --primary-bg:#fafafa; --primary-fg:#0a0a0a;
    }
  }
  html,body{ height:100%; }
  body{
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    background:var(--bg); color:var(--fg); -webkit-font-smoothing:antialiased; overflow-y:auto;
  }
  button{ font-family:inherit; color:inherit; }
  .app{
    height:100vh; height:100dvh; max-width:56rem; margin:0 auto;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column;
  }
  .stage{
    flex:1; min-height:160px; position:relative;
    border:1px solid var(--line); border-radius:14px; overflow:hidden;
    background-image:radial-gradient(var(--dot) 1px, transparent 1px); background-size:16px 16px;
    touch-action:none;
  }
  .stage-inner{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:14px; }
  #viewCanvas{
    display:none; max-width:100%; max-height:100%; box-shadow:0 0 0 1px var(--line);
    touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  }
  #viewCanvas.show{ display:block; }
  .bottom{ flex:none; margin-top:auto; padding-top:14px; }
  .confirm-slot{ height:46px; display:flex; align-items:center; justify-content:center; }
  .confirm-bar{
    display:none; align-items:center; gap:8px; white-space:nowrap;
    background:var(--bg); border:1px solid var(--line); border-radius:10px;
    padding:6px 6px 6px 14px; box-shadow:0 4px 16px rgba(0,0,0,.08); max-width:100%;
  }
  .confirm-bar.show{ display:flex; }
  #pendingLabel{ font-size:12px; color:var(--sub); }
  .mini-primary{
    height:32px; padding:0 16px; border:none; border-radius:8px; cursor:pointer;
    background:var(--primary-bg); color:var(--primary-fg); font-size:12px; font-weight:600;
  }
  .mini-ghost{
    height:32px; padding:0 12px; border:1px solid var(--line); border-radius:8px;
    background:transparent; font-size:12px; cursor:pointer;
  }
  .mini-ghost:hover{ background:var(--hover); }
  .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:28rem; margin:10px auto 0; }
  .cell{
    height:64px; border:1px solid var(--line); border-radius:12px; background:transparent;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    font-size:12px; font-weight:500; cursor:pointer;
    transition:background-color .15s ease, color .15s ease, border-color .15s ease;
  }
  .cell:hover{ background:var(--hover); }
  .cell:active{ opacity:.8; }
  .cell svg{ width:20px; height:20px; }
  .cell.active{ background:var(--primary-bg); color:var(--primary-fg); border-color:var(--primary-bg); }
  .locked{ opacity:.3; pointer-events:none; transition:opacity .2s; }
  #toast{
    position:fixed; left:50%; top:50%;
    transform:translate(-50%,-50%) scale(.95); opacity:0; pointer-events:none;
    transition:all .25s ease; z-index:50;
    padding:10px 16px; border-radius:10px; font-size:14px; font-weight:500;
    background:var(--bg); border:1px solid var(--line); box-shadow:0 4px 16px rgba(0,0,0,.08);
  }
  #toast.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  #toast.error{ color:#dc2626; border-color:#fecaca; }
  @media (prefers-color-scheme: dark){ #toast.error{ color:#f87171; border-color:#7f1d1d; } }
</style>
</head>
<body>
<input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
<input type="file" id="albumInput" accept="image/*" style="display:none">
<main class="app">
  <section class="stage" id="stageEl">
    <div class="stage-inner"><canvas id="viewCanvas"></canvas></div>
  </section>
  <div class="bottom">
    <div class="confirm-slot">
      <div id="confirmBar" class="confirm-bar">
        <span id="pendingLabel"></span>
        <button id="applyBtn" class="mini-primary">应用</button>
        <button id="cancelBtn" class="mini-ghost">取消</button>
      </div>
    </div>
    <div id="toolRow" class="grid">
      <button data-tool="crop" class="cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>裁切</button>
      <button data-tool="lasso" class="cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4c5 0 9 2.5 9 5.5S16.97 15 12 15s-9-2.5-9-5.5S7 4 12 4Z" stroke-dasharray="4 3"/><path d="M8.5 14.5C7 16 6 17.5 6 19a2.5 2.5 0 0 0 5 .5"/></svg>圈选</button>
      <button id="rotateBtn" class="cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>左转90°</button>
      <button id="resetBtn" class="cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>复原</button>
      <button id="gridCameraBtn" class="cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7.5 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3.5L14.5 4z"/><circle cx="12" cy="13" r="3.5"/></svg>拍照</button>
      <button id="gridAlbumBtn" class="cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4-4L5 22"/></svg>上传</button>
    </div>
  </div>
</main>
<div id="toast"></div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const stageEl=$('stageEl'), viewCanvas=$('viewCanvas'), vctx=viewCanvas.getContext('2d');
  const imgCanvas=document.createElement('canvas');
  let originalCanvas=null, hasImage=false, edited=false;
  let mode='idle', pending=null, drawing=false, dragState=null, startPt=null, antsOffset=0;
  const ACTION_BTNS=['rotateBtn','resetBtn','gridCameraBtn','gridAlbumBtn'];
  const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
  function minCrop(){return Math.max(8,Math.min(imgCanvas.width,imgCanvas.height)*0.05);}
  function cssScale(){const r=viewCanvas.getBoundingClientRect();return r.width?imgCanvas.width/r.width:1;}
  function insideRect(p,r){return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;}
  function hitCrop(p){
    if(!pending||pending.type!=='crop')return null;
    const th=28*cssScale(),l=pending.x,t=pending.y,r=pending.x+pending.w,b=pending.y+pending.h;
    const nL=Math.abs(p.x-l)<=th,nR=Math.abs(p.x-r)<=th,nT=Math.abs(p.y-t)<=th,nB=Math.abs(p.y-b)<=th;
    const inX=p.x>=l&&p.x<=r,inY=p.y>=t&&p.y<=b;
    if(nL&&nT)return'nw';if(nR&&nT)return'ne';if(nL&&nB)return'sw';if(nR&&nB)return'se';
    if(nL&&inY)return'w';if(nR&&inY)return'e';if(nT&&inX)return'n';if(nB&&inX)return's';
    if(insideRect(p,pending))return'move';return null;
  }
  function toast(msg,type){
    const t=$('toast');t.textContent=msg;t.classList.toggle('error',type==='error');
    if(hasImage){const r=viewCanvas.getBoundingClientRect();t.style.left=(r.left+r.width/2)+'px';t.style.top=(r.top+r.height/2)+'px';}
    else{t.style.left='50%';t.style.top='50%';}
    t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),2200);
  }
  async function copyToClipboard(){
    try{
      if(!navigator.clipboard||typeof ClipboardItem==='undefined')throw 0;
      await navigator.clipboard.write([new ClipboardItem({'image/png':new Promise(res=>imgCanvas.toBlob(res,'image/png'))})]);
      return true;
    }catch(e){
      try{const blob=await new Promise(r=>imgCanvas.toBlob(r,'image/png'));const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='编辑后的图片.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);return'download';}
      catch(e2){return false;}
    }
  }
  $('gridCameraBtn').onclick=()=>{if(!pending)$('cameraInput').click();};
  $('gridAlbumBtn').onclick=()=>{if(!pending)$('albumInput').click();};
  $('cameraInput').addEventListener('change',e=>{const f=e.target.files[0];if(f)loadFile(f);e.target.value='';});
  $('albumInput').addEventListener('change',e=>{const f=e.target.files[0];if(f)loadFile(f);e.target.value='';});
  function cloneCanvas(s){const c=document.createElement('canvas');c.width=s.width;c.height=s.height;c.getContext('2d').drawImage(s,0,0);return c;}
  function loadFile(file){
    if(!file.type.startsWith('image/')){toast('请选择图片文件','error');return;}
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      const MAX=4096;let w=img.naturalWidth,h=img.naturalHeight;const sc=Math.min(1,MAX/Math.max(w,h));
      w=Math.max(1,Math.round(w*sc));h=Math.max(1,Math.round(h*sc));
      imgCanvas.width=w;imgCanvas.height=h;imgCanvas.getContext('2d').drawImage(img,0,0,w,h);
      originalCanvas=cloneCanvas(imgCanvas);URL.revokeObjectURL(url);
      hasImage=true;edited=false;pending=null;drawing=false;dragState=null;
      viewCanvas.classList.add('show');setMode('idle');fitView();render();updateLock();toast('图片已载入');
    };
    img.onerror=()=>{URL.revokeObjectURL(url);toast('图片加载失败','error');};img.src=url;
  }
  function fitView(){const MAXV=1600,s=Math.min(1,MAXV/Math.max(imgCanvas.width,imgCanvas.height));viewCanvas.width=Math.max(1,Math.round(imgCanvas.width*s));viewCanvas.height=Math.max(1,Math.round(imgCanvas.height*s));}
  function setMode(m){
    mode=m;
    if(m!=='crop'&&pending&&pending.type==='crop')pending=null;
    if(m!=='lasso'&&pending&&pending.type==='lasso')pending=null;
    if(m==='crop'&&hasImage&&!pending)pending={type:'crop',x:0,y:0,w:imgCanvas.width,h:imgCanvas.height};
    document.querySelectorAll('.cell[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===m));
    viewCanvas.style.cursor=m==='lasso'?'crosshair':'default';updateLock();render();
  }
  function updateLock(){
    const on=!!pending;ACTION_BTNS.forEach(id=>$(id).classList.toggle('locked',on));
    $('confirmBar').classList.toggle('show',on);
    if(on)$('pendingLabel').textContent=pending.type==='crop'?Math.round(pending.w)+' × '+Math.round(pending.h):'已圈选 '+pending.points.length+' 点';
  }
  function render(){
    if(!hasImage)return;const W=viewCanvas.width,H=viewCanvas.height;
    vctx.clearRect(0,0,W,H);vctx.drawImage(imgCanvas,0,0,W,H);
    if(pending&&pending.type==='crop')drawCropOverlay();
    if(pending&&pending.type==='lasso')drawLassoOverlay();
  }
  function drawCropOverlay(){
    const s=viewCanvas.width/imgCanvas.width,fc=cssScale()*s,W=viewCanvas.width,H=viewCanvas.height;
    const vx=pending.x*s,vy=pending.y*s,vw=pending.w*s,vh=pending.h*s;
    vctx.save();vctx.fillStyle='rgba(0,0,0,.55)';vctx.fillRect(0,0,W,H);
    vctx.beginPath();vctx.rect(vx,vy,vw,vh);vctx.clip();vctx.drawImage(imgCanvas,0,0,W,H);vctx.restore();
    vctx.save();vctx.strokeStyle='rgba(255,255,255,.35)';vctx.lineWidth=Math.max(1,fc);vctx.beginPath();
    for(let i=1;i<3;i++){vctx.moveTo(vx+vw*i/3,vy);vctx.lineTo(vx+vw*i/3,vy+vh);vctx.moveTo(vx,vy+vh*i/3);vctx.lineTo(vx+vw,vy+vh*i/3);}
    vctx.stroke();vctx.restore();
    vctx.save();vctx.strokeStyle='rgba(255,255,255,.95)';vctx.lineWidth=4.5*fc;vctx.strokeRect(vx,vy,vw,vh);
    vctx.strokeStyle='#2563eb';vctx.lineWidth=2.5*fc;vctx.strokeRect(vx,vy,vw,vh);vctx.restore();
    const hs=16*fc,pts={nw:[vx,vy],n:[vx+vw/2,vy],ne:[vx+vw,vy],w:[vx,vy+vh/2],e:[vx+vw,vy+vh/2],sw:[vx,vy+vh],s:[vx+vw/2,vy+vh],se:[vx+vw,vy+vh]};
    vctx.save();for(const k in pts){const cx=pts[k][0],cy=pts[k][1];vctx.fillStyle='#fff';vctx.fillRect(cx-hs/2,cy-hs/2,hs,hs);vctx.strokeStyle='#2563eb';vctx.lineWidth=2*fc;vctx.strokeRect(cx-hs/2,cy-hs/2,hs,hs);}vctx.restore();
  }
  function drawLassoOverlay(){
    const s=viewCanvas.width/imgCanvas.width,W=viewCanvas.width,H=viewCanvas.height,pts=pending.points;
    const trace=()=>{vctx.beginPath();pts.forEach((p,i)=>{const px=p.x*s,py=p.y*s;i?vctx.lineTo(px,py):vctx.moveTo(px,py);});vctx.closePath();};
    vctx.save();vctx.fillStyle='rgba(0,0,0,.55)';vctx.fillRect(0,0,W,H);trace();vctx.clip();vctx.drawImage(imgCanvas,0,0,W,H);vctx.restore();
    vctx.save();trace();vctx.strokeStyle='#2563eb';vctx.lineWidth=Math.max(2.5,W/400);vctx.setLineDash([10,6]);vctx.lineDashOffset=antsOffset;vctx.stroke();vctx.restore();
  }
  (function tick(){if(pending&&pending.type==='lasso'){antsOffset-=.6;render();}requestAnimationFrame(tick);})();
  function toImg(e){const r=viewCanvas.getBoundingClientRect();return{x:clamp((e.clientX-r.left)*imgCanvas.width/r.width,0,imgCanvas.width),y:clamp((e.clientY-r.top)*imgCanvas.height/r.height,0,imgCanvas.height)};}
  stageEl.addEventListener('pointerdown',e=>{
    if(!hasImage||mode==='idle')return;const p=toImg(e);
    if(mode==='crop'){const hit=hitCrop(p);if(!hit)return;e.preventDefault();stageEl.setPointerCapture(e.pointerId);drawing=true;dragState=hit==='move'?{kind:'move',dx:p.x-pending.x,dy:p.y-pending.y}:{kind:'resize',handle:hit};}
    else{if(pending)return;e.preventDefault();stageEl.setPointerCapture(e.pointerId);drawing=true;startPt=p;pending={type:'lasso',points:[startPt]};updateLock();}
  });
  stageEl.addEventListener('pointermove',e=>{
    const p=toImg(e);
    if(!drawing){if(mode==='crop'&&pending){const hit=hitCrop(p);const cur={nw:'nwse-resize',se:'nwse-resize',ne:'nesw-resize',sw:'nesw-resize',n:'ns-resize',s:'ns-resize',e:'ew-resize',w:'ew-resize',move:'move'};viewCanvas.style.cursor=hit?cur[hit]:'default';}return;}
    e.preventDefault();
    if(mode==='crop'&&dragState&&pending){
      const W=imgCanvas.width,H=imgCanvas.height,min=minCrop();
      if(dragState.kind==='move'){pending={type:'crop',w:pending.w,h:pending.h,x:clamp(p.x-dragState.dx,0,W-pending.w),y:clamp(p.y-dragState.dy,0,H-pending.h)};}
      else{let l=pending.x,t=pending.y,r=pending.x+pending.w,b=pending.y+pending.h;const hd=dragState.handle;if(hd.includes('w'))l=clamp(p.x,0,r-min);if(hd.includes('e'))r=clamp(p.x,l+min,W);if(hd.includes('n'))t=clamp(p.y,0,b-min);if(hd.includes('s'))b=clamp(p.y,t+min,H);pending={type:'crop',x:l,y:t,w:r-l,h:b-t};}
      render();updateLock();
    }else if(mode==='lasso'&&pending){const last=pending.points[pending.points.length-1];if(Math.hypot(p.x-last.x,p.y-last.y)>Math.max(2,imgCanvas.width/500))pending.points.push(p);render();}
  });
  function endDraw(){
    if(!drawing)return;drawing=false;dragState=null;
    if(pending&&pending.type==='crop')pending={type:'crop',x:Math.round(pending.x),y:Math.round(pending.y),w:Math.round(pending.w),h:Math.round(pending.h)};
    if(pending&&pending.type==='lasso'&&pending.points.length<6){pending=null;toast('圈选范围太小','error');}
    render();updateLock();
  }
  stageEl.addEventListener('pointerup',endDraw);
  stageEl.addEventListener('pointercancel',endDraw);
  stageEl.addEventListener('contextmenu',e=>e.preventDefault());
  document.querySelectorAll('.cell[data-tool]').forEach(btn=>{btn.addEventListener('click',()=>{if(!hasImage)return;setMode(mode===btn.dataset.tool?'idle':btn.dataset.tool);});});
  /* 旋转：只旋转，不复制 */
  $('rotateBtn').addEventListener('click',()=>{
    if(!hasImage||pending)return;
    const w=imgCanvas.width,h=imgCanvas.height,c=document.createElement('canvas');c.width=h;c.height=w;
    const ctx=c.getContext('2d');ctx.translate(0,w);ctx.rotate(-Math.PI/2);ctx.drawImage(imgCanvas,0,0);
    imgCanvas.width=c.width;imgCanvas.height=c.height;imgCanvas.getContext('2d').drawImage(c,0,0);
    edited=true;fitView();render();
    toast('已逆时针旋转 90°');
  });
  $('resetBtn').addEventListener('click',()=>{
    if(!hasImage||pending)return;if(!edited||!originalCanvas){toast('当前已是原图');return;}
    imgCanvas.width=originalCanvas.width;imgCanvas.height=originalCanvas.height;imgCanvas.getContext('2d').drawImage(originalCanvas,0,0);
    edited=false;setMode('idle');fitView();render();toast('已复原');
  });
  $('applyBtn').addEventListener('click',applyPending);
  $('cancelBtn').addEventListener('click',()=>{pending=null;setMode('idle');toast('已取消');});
  /* 应用（裁切/圈选）后才复制到粘贴板 */
  async function applyPending(){
    if(!pending)return;
    if(pending.type==='crop'){
      const x=pending.x,y=pending.y,w=Math.max(1,Math.min(pending.w,imgCanvas.width-x)),h=Math.max(1,Math.min(pending.h,imgCanvas.height-y));
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(imgCanvas,x,y,w,h,0,0,w,h);
      imgCanvas.width=w;imgCanvas.height=h;imgCanvas.getContext('2d').drawImage(c,0,0);
    }else{
      const c=document.createElement('canvas');c.width=imgCanvas.width;c.height=imgCanvas.height;const ctx=c.getContext('2d');
      ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.save();ctx.beginPath();
      pending.points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.clip();ctx.drawImage(imgCanvas,0,0);ctx.restore();
      imgCanvas.width=c.width;imgCanvas.height=c.height;imgCanvas.getContext('2d').drawImage(c,0,0);
    }
    pending=null;edited=true;setMode('idle');fitView();render();updateLock();
    const r=await copyToClipboard();
    if(r===true)toast('已应用并复制到粘贴板');else if(r==='download')toast('已应用，已触发下载保存');else toast('已应用，但复制失败','error');
  }
  window.addEventListener('keydown',e=>{if(!pending)return;if(e.key==='Enter'){e.preventDefault();applyPending();}if(e.key==='Escape'){pending=null;setMode('idle');toast('已取消');}});
  setMode('idle');
})();
</script>
</body>
</html>
